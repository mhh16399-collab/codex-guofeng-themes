<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Windows Codex Theme Preview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      --sidebar: rgba(31, 25, 19, .84);
      --sidebar-text: #eadfce;
      --sidebar-muted: #c8b9a4;
      --selected: rgba(220, 202, 174, .30);
      --accent: #71826b;
      --ink: #3a2b20;
      --surface: rgba(244, 238, 226, .91);
      --surface-border: rgba(78, 60, 43, .30);
      --veil: linear-gradient(90deg, rgba(248,243,234,.25), rgba(248,243,234,.08));
      --window-bg: none;
      --workspace-bg: none;
      --sidebar-filter: blur(14px) saturate(.9);
      --titlebar: rgba(240,238,232,.94);
      --titlebar-filter: blur(14px);
      --titlebar-text: #252525;
      --composer-input: rgba(250,247,240,.95);
      --composer-filter: blur(14px);
      --composer-muted: #8c887f;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      color: var(--ink);
      background: #ddd;
    }
    button { font: inherit; }
    .app {
      width: 100%; height: 100%; position: relative;
      background-color: #ddd;
      background-image: var(--window-bg);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }
    .titlebar {
      height: 52px; display: flex; align-items: center; justify-content: space-between;
      padding-left: 18px; color: var(--titlebar-text); background: var(--titlebar);
      border-bottom: 1px solid rgba(0,0,0,.10); backdrop-filter: var(--titlebar-filter);
    }
    .menu, .window-controls { display: flex; align-items: center; height: 100%; }
    .menu { gap: 26px; font-size: 17px; }
    .app-mark { font-size: 21px; font-weight: 700; margin-right: 2px; }
    .nav-arrow { color: #5a5a5a; font-size: 24px; }
    .window-controls button {
      width: 48px; height: 100%; border: 0; color: var(--titlebar-text); background: transparent;
      font-size: 18px; line-height: 1;
    }
    .window-controls button:last-child:hover { color: white; background: #c42b1c; }
    .shell { height: calc(100% - 52px); display: grid; grid-template-columns: 360px 1fr; }
    .sidebar {
      position: relative; padding: 22px 18px 82px; color: var(--sidebar-text);
      background: var(--sidebar); border-right: 1px solid rgba(255,255,255,.12);
      backdrop-filter: var(--sidebar-filter);
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; margin: 0 5px 21px; }
    .brand { font-size: 24px; font-weight: 650; }
    .brand-actions { display: flex; gap: 18px; font-size: 22px; }
    .nav-list, .task-list { display: grid; gap: 7px; }
    .nav-item, .project-row, .task-row {
      min-height: 42px; display: flex; align-items: center; gap: 13px; padding: 0 11px;
      border-radius: 9px; font-size: 18px;
    }
    .nav-item.active { background: var(--selected); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
    .ico { width: 22px; text-align: center; font-size: 20px; color: inherit; }
    .section-title { margin: 23px 8px 9px; color: var(--sidebar-muted); font-size: 15px; }
    .project-row { font-weight: 600; }
    .task-row { padding-left: 35px; color: var(--sidebar-text); font-size: 16px; }
    .task-row .bell { margin-left: auto; color: var(--sidebar-muted); }
    .profile {
      position: absolute; left: 0; right: 0; bottom: 0; height: 66px;
      display: flex; align-items: center; gap: 11px; padding: 0 20px;
      border-top: 1px solid rgba(120,120,120,.18); background: rgba(245,245,240,.16);
      font-size: 17px;
    }
    .avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: white; background: #8a5bb7; font-size: 11px; }
    .profile-spacer { flex: 1; }
    .workspace {
      position: relative; min-width: 0; overflow: hidden;
      background-image: var(--veil), var(--workspace-bg);
      background-position: center; background-size: cover; background-repeat: no-repeat;
    }
    .workspace::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(255,255,255,.08), transparent 42%, rgba(0,0,0,.07));
    }
    .prompt {
      position: absolute; z-index: 1; left: 12%; top: 43%; transform: translateY(-50%);
      font-size: 34px; font-weight: 500; letter-spacing: .02em; text-shadow: 0 1px 8px rgba(255,255,255,.48);
    }
    .prompt-icon { display: block; margin: 0 auto 28px; width: 54px; height: 54px; border: 3px solid currentColor; border-radius: 48% 52% 55% 45%; opacity: .74; text-align: center; line-height: 46px; }
    .composer {
      position: absolute; z-index: 2; left: 7%; right: 6%; bottom: 24px;
      color: var(--ink); filter: drop-shadow(0 8px 22px rgba(22,16,10,.18));
    }
    .composer-meta {
      height: 55px; display: flex; align-items: center; gap: 29px; padding: 0 24px;
      background: var(--surface); border: 1px solid var(--surface-border); border-radius: 16px 16px 0 0;
      font-size: 16px; backdrop-filter: var(--composer-filter);
    }
    .composer-input {
      height: 116px; display: flex; flex-direction: column; align-items: stretch; justify-content: space-between; padding: 16px 16px 12px 24px;
      background: var(--composer-input); border: 1px solid var(--surface-border); border-radius: 17px;
      font-size: 17px; color: var(--composer-muted); backdrop-filter: var(--composer-filter);
    }
    .composer-toolbar { display: flex; align-items: center; gap: 18px; color: var(--ink); font-size: 15px; }
    .access { color: #d85c34; font-weight: 600; }
    .toolbar-spacer { flex: 1; }
    .voice { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 50%; color: white; background: #111; }
    .send {
      width: 45px; height: 45px; display: grid; place-items: center; border: 0; border-radius: 50%;
      color: white; background: var(--accent); font-size: 26px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="titlebar" data-region="windows-titlebar">
      <div class="menu"><span class="app-mark">▣</span><span class="nav-arrow">←</span><span class="nav-arrow">→</span><span>文件</span><span>编辑</span><span>视图</span><span>帮助</span></div>
      <div class="window-controls"><button aria-label="最小化">─</button><button aria-label="最大化">□</button><button aria-label="关闭">×</button></div>
    </header>
    <div class="shell">
      <aside class="sidebar" data-region="sidebar">
        <div class="brand-row"><span class="brand">Codex⌄</span><span class="brand-actions"><span>⌕</span><span>♧</span></span></div>
        <nav class="nav-list">
          <div class="nav-item"><span class="ico">✎</span>新对话</div>
          <div class="nav-item active"><span class="ico">⑂</span>拉取请求</div>
          <div class="nav-item"><span class="ico">⌘</span>站点</div>
          <div class="nav-item"><span class="ico">◷</span>已安排</div>
          <div class="nav-item"><span class="ico">＠</span>插件</div>
        </nav>
        <div class="section-title">项目</div>
        <div class="project-row"><span class="ico">▱</span>示例工坊<span style="margin-left:auto">›</span></div>
        <div class="section-title">任务</div>
        <div class="task-list">
          <div class="task-row">整理界面规范<span class="bell">♧</span></div>
          <div class="task-row">检查组件状态<span class="bell">♧</span></div>
          <div class="task-row">优化页面层级<span class="bell">♧</span></div>
          <div class="task-row">查看构建结果<span class="bell">♧</span></div>
        </div>
        <div class="profile" data-region="profile"><span class="avatar">MH</span><span>Mm Hh</span><span class="profile-spacer"></span><span>▥　语音</span><span>ⓘ</span></div>
      </aside>
      <section class="workspace" data-region="workspace">
        <div class="prompt"><span class="prompt-icon">⌁</span><span id="promptText"></span></div>
        <div class="composer" data-region="composer">
          <div class="composer-meta"><span>▱　示例工坊</span><span>▰　本地</span><span>⑂　main⌄</span></div>
          <div class="composer-input">
            <span>随心输入</span>
            <div class="composer-toolbar" data-region="composer-toolbar"><span>＋</span><span class="access">♢ 完全访问</span><span class="toolbar-spacer"></span><span>ϟ 5.6 Sol</span><span>中⌄</span><span>♩</span><span class="voice">▥</span></div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <script>
    const themes = {
      "jingxiang-chaxi": {
        name: "静香茶席",
        bg: "url('../../windows/presets/preset-jingxiang-chaxi/background.png')",
        wallpaperMode: "main",
        sidebar: "rgba(31,25,19,.86)", sidebarText: "#eadfce", sidebarMuted: "#c8b9a4",
        selected: "rgba(220,202,174,.30)", accent: "#71826b", ink: "#3a2b20",
        surface: "rgba(244,238,226,.91)", border: "rgba(78,60,43,.30)",
        veil: "linear-gradient(90deg, rgba(248,243,234,.22), rgba(248,243,234,.04))"
      },
      "citong-haibo": {
        name: "刺桐海舶",
        bg: "url('../../windows/presets/preset-citong-haibo/background.png')",
        wallpaperMode: "main",
        sidebar: "rgba(6,25,33,.87)", sidebarText: "#d7d6cc", sidebarMuted: "#9ea9a5",
        selected: "rgba(86,106,103,.68)", accent: "#8d543e", ink: "#26373e",
        surface: "rgba(226,222,210,.93)", border: "rgba(76,64,50,.48)",
        veil: "linear-gradient(90deg, rgba(225,231,229,.15), rgba(225,231,229,.02))"
      },
      "qingming-changjuan": {
        name: "清明长卷",
        bg: "url('../../windows/presets/preset-qingming-changjuan/background.png')",
        wallpaperMode: "window",
        sidebarFilter: "none",
        titlebar: "rgba(240,238,232,.94)",
        sidebar: "rgba(242,235,219,.58)", sidebarText: "#2f2c27", sidebarMuted: "#8b8376",
        selected: "rgba(150,140,120,.23)", accent: "#a45135", ink: "#302c26",
        surface: "rgba(250,247,239,.94)", border: "rgba(103,87,65,.24)",
        veil: "linear-gradient(90deg, rgba(255,252,243,.12), rgba(255,252,243,.02))"
      },
      "yanlan-liubai": {
        name: "烟岚留白",
        bg: "url('../../windows/presets/preset-yanlan-liubai/background.png')",
        wallpaperMode: "window",
        sidebarFilter: "none",
        titlebar: "rgb(232,235,231)",
        sidebar: "rgba(231,235,231,.64)", sidebarText: "#283237", sidebarMuted: "#727d7d",
        selected: "rgba(113,126,123,.18)", accent: "#b54b3d", ink: "#283237",
        surface: "rgba(247,246,240,.94)", border: "rgba(74,86,84,.22)",
        veil: "linear-gradient(90deg, rgba(244,247,244,.08), rgba(244,247,244,.01))"
      },
      "bingqing-yuanxiu": {
        name: "冰青远岫",
        bg: "url('../../windows/presets/preset-bingqing-yuanxiu/background.png')",
        wallpaperMode: "window",
        sidebarFilter: "none",
        titlebar: "rgb(232,238,238)",
        sidebar: "rgba(232,240,240,.68)", sidebarText: "#294951", sidebarMuted: "#6d858a",
        selected: "rgba(70,118,125,.16)", accent: "#5b8f97", ink: "#294951",
        surface: "rgba(247,250,249,.94)", border: "rgba(62,94,100,.20)",
        veil: "linear-gradient(90deg, rgba(244,249,249,.06), rgba(244,249,249,.01))"
      },
      "lanting-qushui": {
        name: "兰亭曲水",
        bg: "url('../../windows/presets/preset-lanting-qushui/background.png')",
        wallpaperMode: "window",
        sidebarFilter: "none", titlebarFilter: "none", composerFilter: "none",
        titlebar: "rgb(243,239,228)", titlebarText: "#263334",
        sidebar: "rgba(243,239,228,.72)", sidebarText: "#263334", sidebarMuted: "#6f7d7a",
        selected: "rgba(83,124,118,.16)", accent: "#537c76", ink: "#263334",
        surface: "rgba(248,247,241,.94)", composerInput: "rgba(248,247,241,.97)", composerMuted: "#6f7d7a",
        border: "rgba(74,94,91,.22)",
        veil: "linear-gradient(90deg, rgba(248,247,241,.05), rgba(248,247,241,.01))"
      },
      "yanshan-qiuse": {
        name: "燕山秋色",
        bg: "url('../../windows/presets/preset-yanshan-qiuse/background.png')",
        wallpaperMode: "window",
        sidebarFilter: "none", titlebarFilter: "none", composerFilter: "none",
        titlebar: "rgb(238,229,213)", titlebarText: "#332d27",
        sidebar: "rgba(238,229,213,.72)", sidebarText: "#332d27", sidebarMuted: "#786f65",
        selected: "rgba(166,90,56,.14)", accent: "#a65a38", ink: "#332d27",
        surface: "rgba(249,245,236,.94)", composerInput: "rgba(249,245,236,.97)", composerMuted: "#786f65",
        border: "rgba(101,83,65,.24)",
        veil: "linear-gradient(90deg, rgba(250,246,238,.05), rgba(250,246,238,.01))"
      },
      "chibi-yehang": {
        name: "赤壁夜航",
        bg: "url('../../windows/presets/preset-chibi-yehang/background.png')",
        wallpaperMode: "window",
        sidebarFilter: "none", titlebarFilter: "none", composerFilter: "none",
        titlebar: "rgb(12,21,31)", titlebarText: "#e6e2da",
        sidebar: "rgba(7,15,24,.82)", sidebarText: "#e6e2da", sidebarMuted: "#9ba7b0",
        selected: "rgba(180,92,69,.20)", accent: "#b45c45", ink: "#e6e2da",
        surface: "rgba(15,27,39,.96)", composerInput: "rgba(15,27,39,.98)", composerMuted: "#9ba7b0",
        border: "rgba(132,151,168,.26)",
        veil: "linear-gradient(90deg, rgba(7,14,23,.12), rgba(7,14,23,.03))"
      }
    };
    const id = new URLSearchParams(location.search).get("theme") || "jingxiang-chaxi";
    const theme = themes[id] || themes["jingxiang-chaxi"];
    const root = document.body.style;
    root.setProperty("--window-bg", theme.wallpaperMode === "window" ? theme.bg : "none");
    root.setProperty("--workspace-bg", theme.wallpaperMode === "main" ? theme.bg : "none");
    root.setProperty("--sidebar-filter", theme.sidebarFilter || "blur(14px) saturate(.9)");
    root.setProperty("--titlebar", theme.titlebar || "rgba(240,238,232,.94)");
    root.setProperty("--titlebar-filter", theme.titlebarFilter || "blur(14px)");
    root.setProperty("--titlebar-text", theme.titlebarText || "#252525");
    root.setProperty("--composer-filter", theme.composerFilter || "blur(14px)");
    root.setProperty("--composer-input", theme.composerInput || "rgba(250,247,240,.95)");
    root.setProperty("--composer-muted", theme.composerMuted || "#8c887f");
    root.setProperty("--sidebar", theme.sidebar);
    root.setProperty("--sidebar-text", theme.sidebarText);
    root.setProperty("--sidebar-muted", theme.sidebarMuted);
    root.setProperty("--selected", theme.selected);
    root.setProperty("--accent", theme.accent);
    root.setProperty("--ink", theme.ink);
    root.setProperty("--surface", theme.surface);
    root.setProperty("--surface-border", theme.border);
    root.setProperty("--veil", theme.veil);
    document.getElementById("promptText").textContent = `想在${theme.name}中构建什么？`;
  </script>
</body>
</html>
